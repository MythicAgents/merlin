name: "CodeQL"

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  schedule:
    - cron: '32 7 * * 4'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up Go BEFORE codeql-action/init. In manual build-mode CodeQL's Go extractor
      # works by wrapping the `go` on PATH with a tracing shim at init time; if setup-go
      # ran after init it would prepend its own Go and shadow that shim, so the build runs
      # untraced and CodeQL sees no code ("didn't build any of it").
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the container module's go directive.
          go-version-file: Payload_Type/merlin/container/go.mod
          check-latest: true

      # build-mode: manual. CodeQL's Go extractor does NOT support build-mode: none
      # (it fails database init with "Go does not support the none build mode"), so we
      # drive the build ourselves. This repo has two modules under Payload_Type/merlin/:
      #   * container/ - a normal Go module; we build it here so CodeQL extracts it.
      #   * agent/     - a cgo c-shared wrapper that needs MinGW, build tags, and a
      #                  release-gated merlin-agent require. It is therefore NOT analyzed
      #                  by CodeQL (same reason golangci-lint/govulncheck skip it in go.yml);
      #                  it stays build-checked + gosec'd by go.yml's agent job.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          # queries: security-extended,security-and-quality

      - name: Build container module (manual build-mode, traced by CodeQL)
        working-directory: ./Payload_Type/merlin/container
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
