name: "CodeQL"

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  schedule:
    - cron: '32 7 * * 4'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # build-mode: none (no autobuild). This repo has two modules under Payload_Type/merlin/
      # and the agent module is a cgo c-shared wrapper that needs MinGW and specific build tags,
      # so autobuild cannot cover both. Build-mode none extracts all Go sources without building,
      # giving CodeQL coverage of both the container and agent modules.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
