# Build and push the Merlin Mythic payload container image to GHCR.
#
# Adapted from the MythicAgents convention (Apollo/Poseidon, originally Thanatos):
# publish to GHCR using the built-in GITHUB_TOKEN (no external registry secret to
# leak) and tag the image to the git release tag. The auto-commit / tag-moving job
# from that template is intentionally omitted here — config.json's remote_images
# reference is updated by hand as part of cutting a release.

name: Build and push container images

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push the Merlin container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only needed when we actually push (tag builds); PR/dispatch builds validate only.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository is lowercased by the action -> ghcr.io/mythicagents/merlin
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=${{ github.repository }} container for use with Mythic
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push the Merlin container image
        uses: docker/build-push-action@v6
        with:
          context: Payload_Type/merlin
          file: Payload_Type/merlin/Dockerfile
          platforms: linux/amd64,linux/arm64
          # Push only on a version tag; pull_request / workflow_dispatch build to validate.
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
