name: "Build, Test & Lint"

# merlin-mythic holds two Go modules under Payload_Type/merlin/:
#   * container/ - the Mythic payload-type container (a normal module; full tooling applies)
#   * agent/     - a thin cgo wrapper that c-shares merlin-agent into a Windows DLL
# The agent module cannot be analyzed by golangci-lint or govulncheck: merlin.c requires cgo
# (so `./...` fails a plain typecheck) and its merlin-agent require is release-gated to an older,
# pre-upgrade dependency set. It is therefore build-checked (Linux bin + Windows DLL) and gosec'd,
# the same targets the old build.yml produced, but not linted/vuln-scanned.

on:
  push:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  pull_request:
    branches: [ "dev", "main" ]
    paths-ignore:
      - '.github/**'
      - '.gitattributes'
      - '.gitignore'
      - 'agent_icons/**'
      - 'documentation-payload/**'
      - 'agent_capabilities.json'
      - 'config.json'
      - 'LICENSE'
      - 'README.MD'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: Container Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Payload_Type/merlin/container
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth for the Go version: the module's go directive.
          go-version-file: Payload_Type/merlin/container/go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Vulnerability scan (govulncheck)
        # Built with the toolchain selected above so it can analyze this module's Go version.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    name: Container Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Payload_Type/merlin/container/go.mod
          check-latest: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: Payload_Type/merlin/container

  gosec:
    name: Container Security scan (gosec)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Payload_Type/merlin/container
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Payload_Type/merlin/container/go.mod
          check-latest: true

      - name: gosec
        # Run gosec with the toolchain selected above (mirrors govulncheck) so it can analyze
        # this module's Go version; the securego/gosec Docker action can ship an older Go.
        # G115 (integer overflow on conversion) is excluded repo-wide, matching the previous CI.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude G115 ./...

  agent:
    name: Agent Build & Security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Payload_Type/merlin/agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Payload_Type/merlin/agent/go.mod
          check-latest: true

      # MinGW is needed to cross-compile the Windows c-shared agent DLL.
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y -q mingw-w64

      - name: Build agent (Linux)
        run: go build -o merlin.bin -tags=mythic main.go

      - name: Build agent (Windows DLL)
        env:
          GOOS: windows
          # Pin the target arch: this is the x86_64 Windows DLL, and without it Go defaults
          # GOARCH to the runner's arch (amd64 on GitHub, but e.g. arm64 locally under act).
          GOARCH: amd64
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
        run: go build -o merlin.dll -buildmode=c-shared -tags=mythic,shared .

      - name: gosec
        # golangci-lint/govulncheck cannot analyze this cgo c-shared module (see the header
        # comment); gosec can, as it parses the tag-selected Go sources without a cgo build.
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -exclude G115 -tags mythic ./...
